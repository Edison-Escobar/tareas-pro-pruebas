name: Pruebas de Tareas Pro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tareas_pro_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tareas_pro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/tareas_pro_test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas unitarias e integración
        run: pnpm exec vitest run --coverage

      - name: Compilar aplicación
        run: pnpm build

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: pnpm test:e2e


